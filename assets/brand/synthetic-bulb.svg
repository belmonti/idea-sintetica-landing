<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="coreGlowGrad" x1="150" y1="100" x2="450" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f5c4" />
      <stop offset="45%" stop-color="#06b6d4" />
      <stop offset="85%" stop-color="#b4ff39" />
    </linearGradient>
    
    <linearGradient id="bulbShellGrad" x1="180" y1="80" x2="420" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f5c4" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#06b6d4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#b4ff39" stop-opacity="0.1" />
    </linearGradient>

    <radialGradient id="plasmaAura" cx="300" cy="240" r="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f5c4" stop-opacity="0.35" />
      <stop offset="40%" stop-color="#06b6d4" stop-opacity="0.15" />
      <stop offset="70%" stop-color="#b4ff39" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="sparkCenter" cx="300" cy="220" r="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#00f5c4" />
      <stop offset="100%" stop-color="#00f5c4" stop-opacity="0" />
    </radialGradient>

    <!-- Filters for electric luminescence -->
    <filter id="hyperGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="18" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Plasma Aura -->
  <circle cx="300" cy="240" r="220" fill="url(#plasmaAura)" />

  <!-- Orbiting Technical Ring (Synthesis Gyroscope) -->
  <circle cx="300" cy="240" r="190" stroke="url(#coreGlowGrad)" stroke-width="1.2" stroke-dasharray="4 8" opacity="0.4" />
  <circle cx="300" cy="240" r="160" stroke="#00f5c4" stroke-width="0.8" stroke-dasharray="2 16" opacity="0.3" />

  <!-- Orbiting Nodes of Idea Synthesis -->
  <g class="orbiting-satellites">
    <circle cx="300" cy="50" r="4" fill="#00f5c4" filter="url(#softGlow)" />
    <circle cx="490" cy="240" r="3.5" fill="#b4ff39" filter="url(#softGlow)" />
    <circle cx="110" cy="240" r="3" fill="#06b6d4" filter="url(#softGlow)" />
    <circle cx="300" cy="430" r="4" fill="#00f5c4" filter="url(#softGlow)" />
  </g>

  <!-- The Architectural Lightbulb Contour (Modern Diamond-Filament Profile) -->
  <path d="M210 240C210 190.294 250.294 150 300 150C349.706 150 390 190.294 390 240C390 274.673 370.435 304.792 341.83 319.923C333.916 324.113 328.995 332.355 328.995 341.272V375C328.995 380.523 324.518 385 318.995 385H281.005C275.482 385 271.005 380.523 271.005 375V341.272C271.005 332.355 266.084 324.113 258.17 319.923C229.565 304.792 210 274.673 210 240Z" 
        stroke="url(#bulbShellGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="rgba(8, 14, 26, 0.45)" filter="url(#softGlow)" />

  <!-- Base Screw Ring Threads (Geometric Tech Style) -->
  <path d="M272 400C280 403 320 403 328 400" stroke="#00f5c4" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
  <path d="M275 415C282 418 318 418 325 415" stroke="url(#coreGlowGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
  <path d="M282 430C288 432 312 432 318 430" stroke="#b4ff39" stroke-width="3" stroke-linecap="round" />

  <!-- Contact Terminal Point -->
  <circle cx="300" cy="442" r="4.5" fill="#00f5c4" filter="url(#softGlow)" />

  <!-- Internal Synthetic Filament: Neural Quantum Spark -->
  <!-- Radiating Energy Lines from Spark Core -->
  <line x1="300" y1="220" x2="300" y2="175" stroke="#ffffff" stroke-width="2" stroke-linecap="round" filter="url(#softGlow)" />
  <line x1="300" y1="220" x2="340" y2="195" stroke="#00f5c4" stroke-width="1.8" stroke-linecap="round" />
  <line x1="300" y1="220" x2="260" y2="195" stroke="#00f5c4" stroke-width="1.8" stroke-linecap="round" />
  <line x1="300" y1="220" x2="345" y2="245" stroke="#06b6d4" stroke-width="1.5" stroke-linecap="round" />
  <line x1="300" y1="220" x2="255" y2="245" stroke="#06b6d4" stroke-width="1.5" stroke-linecap="round" />
  <line x1="300" y1="220" x2="300" y2="280" stroke="#b4ff39" stroke-width="2" stroke-linecap="round" />

  <!-- Geometric Filament Hexagon Ring -->
  <polygon points="300,185 330,202 330,238 300,255 270,238 270,202" 
           stroke="url(#coreGlowGrad)" stroke-width="1.8" fill="rgba(0, 245, 196, 0.08)" filter="url(#softGlow)" />

  <!-- Secondary Internal Orbit Ring -->
  <circle cx="300" cy="220" r="18" stroke="#ffffff" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.8" />

  <!-- Central Incandescent Core (La Chispa de la Idea) -->
  <circle cx="300" cy="220" r="28" fill="url(#sparkCenter)" />
  <circle cx="300" cy="220" r="8" fill="#ffffff" filter="url(#hyperGlow)" />

  <!-- Energy Pulse Conduits Traveling Down into Base -->
  <path d="M285 270V350L295 375" stroke="#00f5c4" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.7" />
  <path d="M315 270V350L305 375" stroke="#b4ff39" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.7" />

  <!-- Radiating Pulses of Clarity (Concentric Shockwaves) -->
  <circle cx="300" cy="220" r="75" stroke="#00f5c4" stroke-width="1" stroke-dasharray="2 10" opacity="0.45" />
  <circle cx="300" cy="220" r="115" stroke="#b4ff39" stroke-width="0.75" stroke-dasharray="6 14" opacity="0.25" />
</svg>
