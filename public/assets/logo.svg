<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="bulbGrad" x1="6" y1="6" x2="42" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f5c4" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#a3e635" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f5c4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#a3e635" stop-opacity="0.1" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient outer circle -->
  <circle cx="24" cy="24" r="22" fill="#0b1320" stroke="url(#bulbGrad)" stroke-width="1.5" stroke-opacity="0.4" />
  
  <!-- Subtle tech grid background in icon -->
  <circle cx="24" cy="24" r="16" fill="url(#glowGrad)" />

  <!-- Bulb contour synthesized with circuit flow -->
  <path d="M16 18C16 13.5817 19.5817 10 24 10C28.4183 10 32 13.5817 32 18C32 20.9458 30.4079 23.5186 28.0384 24.8877C27.3912 25.2616 27 25.9602 27 26.7099V29C27 29.5523 26.5523 30 26 30H22C21.4477 30 21 29.5523 21 29V26.7099C21 25.9602 20.6088 25.2616 19.9616 24.8877C17.5921 23.5186 16 20.9458 16 18Z" 
        stroke="url(#bulbGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)" />

  <!-- Base of the bulb -->
  <path d="M21 33H27" stroke="url(#bulbGrad)" stroke-width="2" stroke-linecap="round" />
  <path d="M22.5 36H25.5" stroke="#a3e635" stroke-width="2" stroke-linecap="round" />

  <!-- Internal synthetic core / circuit filament -->
  <circle cx="24" cy="18" r="2.5" fill="#00f5c4" />
  <path d="M24 14V15.5M24 20.5V23M19.5 18H21.5M26.5 18H28.5" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />

  <!-- Orbiting dynamic nodes (synthesis idea) -->
  <circle cx="12" cy="14" r="1.5" fill="#00f5c4" />
  <circle cx="36" cy="14" r="1.5" fill="#a3e635" />
  <circle cx="24" cy="5" r="1.5" fill="#00f5c4" />
</svg>
