<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="none">
  <defs>
    <linearGradient id="wireGrad" x1="100" y1="50" x2="400" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f5c4" />
      <stop offset="100%" stop-color="#b4ff39" />
    </linearGradient>
    <radialGradient id="ctaAura" cx="250" cy="200" r="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f5c4" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="wfGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <circle cx="250" cy="200" r="180" fill="url(#ctaAura)" />

  <!-- Outer Wireframe Circles -->
  <circle cx="250" cy="180" r="130" stroke="url(#wireGrad)" stroke-width="1.2" stroke-dasharray="4 8" opacity="0.4" />
  <circle cx="250" cy="180" r="95" stroke="#00f5c4" stroke-width="1" stroke-dasharray="2 12" opacity="0.3" />

  <!-- Bulb Silhouette Contour Wireframe -->
  <path d="M160 180 C 160 130, 200 90, 250 90 C 300 90, 340 130, 340 180 C 340 215, 320 240, 295 260 V 305 H 205 V 260 C 180 240, 160 215, 160 180 Z" 
        stroke="url(#wireGrad)" stroke-width="2" stroke-linecap="round" fill="rgba(8, 14, 25, 0.4)" filter="url(#wfGlow)" />

  <!-- Internal Cross Lattice Lines -->
  <line x1="250" y1="100" x2="250" y2="300" stroke="#00f5c4" stroke-width="1.2" stroke-dasharray="6 6" opacity="0.5" />
  <line x1="170" y1="180" x2="330" y2="180" stroke="#00f5c4" stroke-width="1.2" stroke-dasharray="6 6" opacity="0.5" />

  <!-- Base Elements -->
  <path d="M210 320 H 290" stroke="url(#wireGrad)" stroke-width="2.5" stroke-linecap="round" />
  <path d="M215 335 H 285" stroke="url(#wireGrad)" stroke-width="2.5" stroke-linecap="round" />
  <path d="M225 350 H 275" stroke="#b4ff39" stroke-width="3" stroke-linecap="round" />
  <circle cx="250" cy="365" r="4" fill="#00f5c4" filter="url(#wfGlow)" />

  <!-- Glowing Spark Core in Center of Bulb -->
  <polygon points="250,150 275,165 275,195 250,210 225,195 225,165" stroke="#ffffff" stroke-width="1.5" fill="rgba(0, 245, 196, 0.15)" />
  <circle cx="250" cy="180" r="10" fill="#ffffff" filter="url(#wfGlow)" />
  <circle cx="250" cy="180" r="3" fill="#00f5c4" />
</svg>
